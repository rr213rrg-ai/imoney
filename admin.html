<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>I MONEY - Admin Panel</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body {
      margin: 0;
      background-color: #0b1324;
      color: #ffffff;
      padding: 20px;
    }
    .container {
      max-width: 820px;
      margin: 0 auto;
    }
    .card {
      background-color: #162033;
      border: 1px solid #26334d;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
    }
    h2 { color: #2196f3; margin: 0 0 14px 0; }
    label {
      display: block;
      font-size: 13px;
      color: #cbd5e1;
      margin-bottom: 6px;
    }
    input {
      background: #1b263b;
      color: #fff;
      width: 100%;
      max-width: 320px;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #2d3b55;
      font-size: 14px;
      margin-bottom: 14px;
    }
    button {
      background: #2196f3;
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
    }
    .delete-btn {
      background: #dc2626;
      color: #ffffff;
      padding: 8px 14px;
      font-size: 13px;
    }
    .delete-btn:hover { background: #b91c1c; }
    .user-block {
      background-color: #162033;
      border: 1px solid #26334d;
      border-radius: 12px;
      padding: 16px 18px;
      margin-bottom: 14px;
    }
    .user-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }
    .phone-title {
      font-size: 17px;
      font-weight: bold;
      color: #38bdf8;
    }
    .codes-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    @media (max-width: 600px) {
      .codes-grid { grid-template-columns: 1fr; }
    }
    .code-box {
      background-color: #1b263b;
      border: 1px solid #2d3b55;
      border-radius: 8px;
      padding: 12px;
      text-align: center;
    }
    .code-label {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 6px;
    }
    .code-val {
      font-size: 18px;
      font-weight: bold;
      color: #4ade80;
    }
    .code-empty {
      color: #64748b;
    }
    #dashboard { display: none; }
    .empty-msg {
      text-align: center;
      color: #94a3b8;
      padding: 20px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div id="loginBox" class="card">
      <h2>Admin Login</h2>
      <label for="adminEmail">Admin Email</label>
      <input type="email" id="adminEmail" placeholder="admin@example.com" required />

      <label for="adminPass">Password</label>
      <input type="password" id="adminPass" placeholder="Enter Password" required />
      <br />
      <button onclick="loginAdmin()">Login</button>
      <p id="loginError" style="color:#f87171; margin-top:10px;"></p>
    </div>

    <div id="dashboard">
      <div class="card">
        <h2>Admin Dashboard</h2>
      </div>
      <div id="userBlocks"></div>
    </div>
  </div>

  <script>
    const ADMIN_EMAIL = "admin@example.com"; // Apna admin email yahan set karein
    const ADMIN_PASSWORD = "admin123";        // Apna admin password yahan set karein

    let refreshTimer = null;
    let isFetching = false;

    const BOX_LABELS = [
      "1st Time Register Code",
      "2nd Time Register Code",
      "3rd Time Register Code"
    ];

    function loginAdmin() {
      const email = document.getElementById('adminEmail').value.trim();
      const pass = document.getElementById('adminPass').value;

      if (email === ADMIN_EMAIL && pass === ADMIN_PASSWORD) {
        document.getElementById('loginBox').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        loadUsers();
        clearInterval(refreshTimer);
        refreshTimer = setInterval(loadUsers, 1000);
      } else {
        document.getElementById('loginError').textContent = "Invalid email or password!";
      }
    }

    async function loadUsers() {
      if (isFetching) return;
      isFetching = true;

      try {
        const res = await fetch('/api/submissions', { cache: 'no-store' });
        const users = await res.json();
        renderBlocks(Array.isArray(users) ? users : []);
      } catch (err) {
        console.error("Error loading submissions:", err);
      } finally {
        isFetching = false;
      }
    }

    function renderBlocks(users) {
      const container = document.getElementById('userBlocks');

      if (users.length === 0) {
        container.innerHTML = `<div class="card empty-msg">No users found.</div>`;
        return;
      }

      container.innerHTML = users.map(user => {
        const codes = Array.isArray(user.codes) ? user.codes : [];

        const fixedBoxesHtml = BOX_LABELS.map((label, idx) => {
          const val = codes[idx];
          const hasCode = val !== undefined && val !== null && String(val).trim() !== "";
          return `
            <div class="code-box">
              <div class="code-label">${label}</div>
              <div class="code-val ${hasCode ? '' : 'code-empty'}">
                ${hasCode ? escapeHtml(val) : '-'}
              </div>
            </div>
          `;
        }).join('');

        return `
          <div class="user-block">
            <div class="user-top">
              <div class="phone-title">Phone: ${escapeHtml(user.phone)}</div>
              <button class="delete-btn" onclick="deleteUser('${encodeURIComponent(user.phone)}')">Delete</button>
            </div>
            <div class="codes-grid">
              ${fixedBoxesHtml}
            </div>
          </div>
        `;
      }).join('');
    }

    async function deleteUser(encodedPhone) {
      try {
        const res = await fetch(`/api/submissions/${encodedPhone}`, {
          method: 'DELETE'
        });
        if (res.ok) {
          await loadUsers();
        }
      } catch (err) {
        console.error("Failed to delete user:", err);
      }
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }
  </script>
</body>
</html>
